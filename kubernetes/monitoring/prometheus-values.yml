# ============================================================
# NexusFlow — Prometheus + Grafana Helm Values
# File: kubernetes/monitoring/prometheus-values.yml
# ============================================================

grafana:
  enabled: true
  adminPassword: nexusflow2026   # DEMO CREDENTIALS , ⚠️ change for prod
  replicas: 1
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  service:
    type: LoadBalancer
  dashboardProviders:
    dashboardproviders.yaml:
      apiVersion: 1
      providers:
        - name: nexusflow
          folder: NexusFlow
          type: file
          options:
            path: /var/lib/grafana/dashboards/nexusflow

prometheus:
  prometheusSpec:
    replicas: 1
    retention: 7d
    resources:
      requests:
        cpu: 200m
        memory: 512Mi
      limits:
        cpu: 1
        memory: 2Gi
    storageSpec:
      volumeClaimTemplate:
        spec:
          resources:
            requests:
              storage: 10Gi
    additionalScrapeConfigs:
      - job_name: nexusflow-pods
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names: [nexusflow, kafka, airflow]
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
            action: keep
            regex: "true"
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_port]
            action: replace
            target_label: __address__
            regex: (.+)
            replacement: $1

alertmanager:
  enabled: true
  alertmanagerSpec:
    replicas: 1
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
    secrets:
      - alertmanager-slack
  config:
    global:
      slack_api_url_file: /etc/alertmanager/secrets/alertmanager-slack/slack_api_url
    route:
      group_by: [alertname, severity]
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 4h
      receiver: slack-nexusflow
    receivers:
      - name: slack-nexusflow
        slack_configs:
          - channel: "#all-ss-nexusflow-dev-workspace"
            send_resolved: true
            title: "{{ if eq .Status \"firing\" }}🚨{{ else }}✅{{ end }} {{ .GroupLabels.alertname }}"
            text: "{{ range .Alerts }}{{ .Annotations.summary }}\n{{ end }}"