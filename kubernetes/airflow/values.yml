# ============================================================
# NexusFlow — Airflow Helm Values
# File: kubernetes/airflow/values.yml

# webserver     → scheduler → triggerer → dags →
# logs          → data      → postgresql → redis →
# env           → serviceAccount

# Chart version: 1.16.0 (Airflow 2.10.5) - Pinned to avoid version drift
# ============================================================

airflowVersion: "2.10.5"
defaultAirflowTag: "2.10.5"

fernetKey: "aJfdlCJjZwddeCQgyUZwlHJqmgqfmjBKbYQUJm29HDo=" # DEMO CREDENTIALS ⚠️ change for prod
webserverSecretKey: "nexusflow-secret-key-2026"


# Custom image with providers pre-installed
images:
  airflow:
    repository: ECR_REGISTRY/nexusflow-airflow
    tag: "2.10.5"
    pullPolicy: Always

executor: LocalExecutor

# ── WEBSERVER ─────────────────────────────────────────────
webserver:
  service:
    type: LoadBalancer
  replicas: 1
  resources:
    requests:
      cpu: 200m
      memory: 1Gi
    limits:
      cpu: 2
      memory: 3Gi
  # Extended probes — give more time to start and recover
  startupProbe:
    timeoutSeconds: 30
    failureThreshold: 60
    periodSeconds: 15
  livenessProbe:
    timeoutSeconds: 30
    failureThreshold: 10
    periodSeconds: 15
  readinessProbe:
    timeoutSeconds: 30
    failureThreshold: 10
    periodSeconds: 15
  defaultUser:
    enabled: true
    role: Admin
    username: admin
    email: admin@nexusflow.io
    firstName: Nexus
    lastName: Flow
    password: nexusflow2026   # DEMO CREDENTIALS ⚠️ change for prod

# ── SCHEDULER ─────────────────────────────────────────────
scheduler:
  replicas: 1
  resources:
    requests:
      cpu: 200m
      memory: 1Gi
    limits:
      cpu: 1
      memory: 2Gi

# ── TRIGGERER — disabled for LocalExecutor ────────────────
triggerer:
  enabled: false

# ── DAGS ──────────────────────────────────────────────────
dags:
  gitSync:
    enabled: true
    repo: https://github.com/smshde/NexusFlow-DataOps-Pipeline.git # ⚠️ 
    branch: main
    subPath: airflow/dags
    period: 60s         # sync every 60 seconds
    wait: 60            # wait 60s before first sync

# ── LOGS ──────────────────────────────────────────────────
logs:
  persistence:
    enabled: true
    size: 5Gi

workers:
  persistence:
    enabled: false

# ── DATABASE CONNECTION ───────────────────────────────────
data:
  metadataConnection:
    user: airflow
    pass: airflow
    host: airflow-postgres
    port: 5432 
    db: airflow
    sslmode: disable

# ── POSTGRESQL — disabled, using standalone pod ───────────
postgresql:
  enabled: false

# ── REDIS — not needed for LocalExecutor ─────────────────
redis:
  enabled: false

# ── ENVIRONMENT VARIABLES ─────────────────────────────────
env:
  - name: AIRFLOW__CORE__LOAD_EXAMPLES
    value: "false"
  - name: NEXUSFLOW_ENV
    value: "dev"
  - name: AWS_REGION
    value: "ca-central-1"
  # Remote logging to S3 — works around webserver/scheduler pods not
  # sharing the (RWO) logs PVC on EKS. IRSA on airflow-scheduler SA
  # supplies creds, so the conn just needs the "aws://" default-chain URI.
  - name: AIRFLOW__LOGGING__REMOTE_LOGGING
    value: "true"
  - name: AIRFLOW__LOGGING__REMOTE_LOG_CONN_ID
    value: "aws_default"
  - name: AIRFLOW_CONN_AWS_DEFAULT
    value: "aws://"

# Dynamic AWS values injected from ConfigMap created by full_deploy.sh
extraEnvFrom:
  - configMapRef:
      name: airflow-dynamic-config

 # ── SERVICE ACCOUNT ───────────────────────────────────────       
serviceAccount:
  create: true
  name: airflow-scheduler
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::ACCOUNT_ID:role/nexusflow-dev-airflow-irsa # ⚠️ 


