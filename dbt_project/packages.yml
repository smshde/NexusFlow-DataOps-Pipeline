# dbt package dependencies.
# Gold models + tests use dbt_utils macros: generate_surrogate_key,
# date_spine, expression_is_true, unique_combination_of_columns.
# 1.3.0 is the release line compatible with dbt-core 1.8.x.
# Installed at image-build time (src/dbt/Dockerfile runs `dbt deps`) so
# every ephemeral KubernetesPodOperator pod ships with dbt_packages/
# already present — the per-task `dbt deps` in the DAG can't share state
# across separate pods.
packages:
  - package: dbt-labs/dbt_utils
    version: 1.3.0
