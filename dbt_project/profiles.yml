nexusflow:
  target: dev
  outputs:

    dev:
      type: redshift
      method: iam
      # cluster_id is for PROVISIONED Redshift only — this is Redshift
      # Serverless. Setting it forced dbt-redshift down the provisioned
      # GetClusterCredentials IAM path against a workgroup name that
      # isn't a real cluster, which hung (no region set either) until
      # connect_timeout fired: "Runtime Error: The read operation timed
      # out". Explicit region + no cluster_id fixes the serverless IAM
      # credential path (redshift-serverless:GetCredentials).
      region: ca-central-1
      host:     "{{ env_var('REDSHIFT_HOST') }}"
      port:     5439
      dbname:   nexusflow
      user:     nexusflow_admin
      schema:   dbt_dev
      threads:  4
      keepalives_idle: 240
      # redshift_connector applies this as the socket read timeout for the
      # WHOLE session, not just initial TCP connect — a long-running CTAS
      # (e.g. silver_orders, the largest table) gets killed mid-read once it
      # crosses this value: "Runtime Error: The read operation timed out".
      # 120s gives headroom for Spectrum CTAS scans over growing bronze data.
      connect_timeout: 120
      ra3_node: true
      search_path: gold,silver,bronze,public

    prod:
      type: redshift
      host:     "{{ env_var('REDSHIFT_HOST') }}"
      port:     5439
      dbname:   nexusflow
      user:     "{{ env_var('REDSHIFT_USER') }}"
      password: "{{ env_var('REDSHIFT_PASSWORD') }}"
      schema:   dbt_prod
      threads:  8
      keepalives_idle: 240
      connect_timeout: 120
      sslmode:  require
      ra3_node: true

    ci:
      type: redshift
      method: iam
      region: ca-central-1
      host: "{{ env_var('REDSHIFT_HOST', 'localhost') }}"
      port: 5439
      dbname: nexusflow
      user: nexusflow_admin
      schema: dbt_ci
      threads: 2
      connect_timeout: 10
