version: 2

models:
  - name: silver_orders
    description: Cleaned deduplicated orders — PII safe
    columns:
      - name: order_id
        tests: [unique, not_null]
      - name: customer_id
        tests: [not_null]
      - name: total_amount
        tests:
          - not_null
          - dbt_utils.expression_is_true:
              expression: ">= 0"
      - name: order_status
        tests:
          - accepted_values:
              values: [pending,confirmed,processing,shipped,delivered,cancelled,refunded]

  - name: silver_customers
    description: PII-masked customer records
    columns:
      - name: customer_id
        tests: [unique, not_null]
      - name: email_hash
        tests: [not_null]
      - name: loyalty_tier
        tests:
          - accepted_values:
              values: [bronze, silver, gold, platinum]

  - name: silver_clickstream
    description: Deduplicated typed clickstream events
    columns:
      - name: event_id
        tests: [unique, not_null]
      - name: event_type
        tests:
          - accepted_values:
              values: [page_view,product_view,add_to_cart,remove_from_cart,
                       checkout_start,search,wishlist_add,review_view,click]

sources:
  # Redshift Spectrum external schema over Spark's own silver output
  # (s3://lakehouse/silver/, crawled into Glue nexusflow_dev_silver).
  # silver_orders/customers/clickstream above are thin views over these
  # tables — dbt does not read raw bronze or re-derive silver itself.
  # External schema bootstrap: dbt_project.yml on-run-start hook.
  - name: silver_lake
    database: nexusflow
    schema: silver_lake
    loader: spark_emr
    loaded_at_field: _processed_ts
    freshness:
      warn_after:  {count: 12, period: hour}
      error_after: {count: 24, period: hour}
    tables:
      - name: orders
      - name: customers
      - name: clickstream
      - name: inventory
