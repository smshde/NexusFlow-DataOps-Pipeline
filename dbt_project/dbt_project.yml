name: nexusflow
version: '1.0.0'
config-version: 2

profile: nexusflow

model-paths:       ["models"]
analysis-paths:    ["analyses"]
test-paths:        ["tests"]
seed-paths:        ["seeds"]
macro-paths:       ["macros"]
snapshot-paths:    ["snapshots"]

target-path:  "target"
clean-targets: ["target", "dbt_packages"]

# ── BOOTSTRAP: SPECTRUM EXTERNAL SCHEMA OVER SPARK'S SILVER ──────
# silver_lake source (models/silver/schema.yml) reads Spark's S3 silver
# output via Spectrum. CREATE EXTERNAL SCHEMA requires CREATE privilege
# on the database — granted once to the dbt IRSA role via a one-time
# admin bootstrap (scripts/deploy/full_deploy.sh, since the IAM-mapped
# role can't grant privileges to itself). With that grant in place this
# hook is self-healing: idempotent, safe on every run/fresh deploy.
on-run-start:
  - "CREATE EXTERNAL SCHEMA IF NOT EXISTS silver_lake FROM DATA CATALOG DATABASE 'nexusflow_dev_silver' IAM_ROLE '{{ env_var(\"REDSHIFT_SPECTRUM_ROLE_ARN\") }}' REGION 'ca-central-1';"

# ── MODEL CONFIGURATIONS ──────────────────────────────────
models:
  nexusflow:
    # Bronze — views only, no materialization cost
    bronze:
      +materialized: view
      +schema: bronze
      +tags: ["bronze", "raw"]

    # Silver — native Redshift tables loaded via CTAS from Spark's silver/
    # Parquet output (Spectrum external schema silver_lake). Spark still owns
    # all silver logic (dedup, typing, PII masking); dbt only lands that output
    # into native Redshift storage with one simple `select *` Spectrum read.
    #
    # Why TABLE, not VIEW-over-Spectrum: a late-binding view straight over an
    # external table works for a single passthrough, but Spectrum imposes
    # query-shape limits (e.g. "Spectrum nested query error" on aggregation +
    # outer scalar funcs). The gold layer's joins/aggregations/window funcs
    # tripped those limits on every model. Landing silver native once (CTAS)
    # removes the entire class of Spectrum limitation for all downstream gold
    # models, and gives them sorted/distributed columnar storage. This is the
    # standard medallion-on-Redshift pattern: Spectrum is the doorway, native
    # tables are the workbench.
    silver:
      +materialized: table
      +schema: silver
      +tags: ["silver", "cleaned"]

    # Gold — facts and dimensions
    gold:
      +materialized: table
      +schema: gold
      +tags: ["gold", "business"]
      # Removed post-hook "GRANT SELECT ... TO GROUP analysts" — that
      # Redshift group is never provisioned anywhere in this project
      # (no terraform resource, no setup script), so every gold model
      # run would fail with 'group "analysts" does not exist'. Add back
      # if/when a real analyst-access group is provisioned.

      facts:
        +materialized: incremental
        +incremental_strategy: merge
        +tags: ["gold", "fact"]
        +dist: even
        +sort: ["order_date"]

      dimensions:
        +materialized: table
        +tags: ["gold", "dimension"]

      ml_features:
        +materialized: table
        +schema: ml_features
        +tags: ["gold", "ml", "features"]

# ── SEEDS ─────────────────────────────────────────────────
seeds:
  nexusflow:
    +schema: ref_data
    +tags: ["seed", "reference"]

# ── SNAPSHOTS (SCD Type 2) ────────────────────────────────
snapshots:
  nexusflow:
    +target_schema: snapshots
    +strategy: check
    +unique_key: customer_id
    +check_cols: ["loyalty_tier", "segment", "total_orders"]
    +invalidate_hard_deletes: true

# ── TESTS ─────────────────────────────────────────────────
tests:
  +store_failures: true
  +schema: dbt_test_failures

# ── VARS ──────────────────────────────────────────────────
vars:
  nexusflow:
    start_date: '2023-01-01'
    lookback_days: 90
    pii_salt: "{{ env_var('DBT_PII_SALT', 'nexusflow_dev') }}"
    environment: "{{ env_var('DBT_ENV', 'dev') }}"

# ── DISPATCH (macro resolution order) ─────────────────────
dispatch:
  - macro_namespace: dbt_utils
    search_order: ["nexusflow", "dbt_utils"]
