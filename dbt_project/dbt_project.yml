name: nexusflow
version: '1.0.0'
config-version: 2

profile: nexusflow

model-paths:       ["models"]
analysis-paths:    ["analyses"]
test-paths:        ["tests"]
seed-paths:        ["seeds"]
macro-paths:       ["macros"]
snapshot-paths:    ["snapshots"]

target-path:  "target"
clean-targets: ["target", "dbt_packages"]

# ── MODEL CONFIGURATIONS ──────────────────────────────────
models:
  nexusflow:
    # Bronze — views only, no materialization cost
    bronze:
      +materialized: view
      +schema: bronze
      +tags: ["bronze", "raw"]

    # Silver — incremental tables
    silver:
      +materialized: incremental
      +incremental_strategy: merge
      +schema: silver
      +tags: ["silver", "cleaned"]
      +on_schema_change: append_new_columns

    # Gold — facts and dimensions
    gold:
      +materialized: table
      +schema: gold
      +tags: ["gold", "business"]
      +post-hook:
        - "GRANT SELECT ON {{ this }} TO GROUP analysts"

      facts:
        +materialized: incremental
        +incremental_strategy: merge
        +tags: ["gold", "fact"]
        +dist: even
        +sort: ["order_date"]

      dimensions:
        +materialized: table
        +tags: ["gold", "dimension"]

      ml_features:
        +materialized: table
        +schema: ml_features
        +tags: ["gold", "ml", "features"]

# ── SEEDS ─────────────────────────────────────────────────
seeds:
  nexusflow:
    +schema: ref_data
    +tags: ["seed", "reference"]

# ── SNAPSHOTS (SCD Type 2) ────────────────────────────────
snapshots:
  nexusflow:
    +target_schema: snapshots
    +strategy: check
    +unique_key: customer_id
    +check_cols: ["loyalty_tier", "segment", "total_orders"]
    +invalidate_hard_deletes: true

# ── TESTS ─────────────────────────────────────────────────
tests:
  +store_failures: true
  +schema: dbt_test_failures

# ── VARS ──────────────────────────────────────────────────
vars:
  nexusflow:
    start_date: '2023-01-01'
    lookback_days: 90
    pii_salt: "{{ env_var('DBT_PII_SALT', 'nexusflow_dev') }}"
    environment: "{{ env_var('DBT_ENV', 'dev') }}"

# ── DISPATCH (macro resolution order) ─────────────────────
dispatch:
  - macro_namespace: dbt_utils
    search_order: ["nexusflow", "dbt_utils"]
