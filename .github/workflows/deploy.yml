name: NexusFlow Deploy (manual)

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: true
        default: dev
        type: choice
        options: [dev, prod]
      deploy_infra:
        description: Run terraform apply
        type: boolean
        default: false

env:
  AWS_REGION: ca-central-1
  PROJECT: nexusflow

jobs:
  push-images:
    name: Build & Push Images
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment }}
    strategy:
      matrix:
        service: [datagen, ingestion, processing, dbt, serving]
    steps:
      - uses: actions/checkout@v4
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ env.AWS_REGION }}
      - name: Login to ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2
      - name: Build & push
        uses: docker/build-push-action@v5
        with:
          context: src/${{ matrix.service }}/
          push: true
          tags: |
            ${{ steps.ecr-login.outputs.registry }}/${{ env.PROJECT }}-${{ matrix.service }}:${{ github.sha }}
            ${{ steps.ecr-login.outputs.registry }}/${{ env.PROJECT }}-${{ matrix.service }}:latest

  k8s-deploy:
    name: Deploy to EKS
    runs-on: ubuntu-latest
    needs: push-images
    environment: ${{ github.event.inputs.environment }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ env.AWS_REGION }}
      - name: Update kubeconfig
        run: aws eks update-kubeconfig --region ${{ env.AWS_REGION }} --name ${{ env.PROJECT }}-${{ github.event.inputs.environment }}-cluster
      - name: Deploy application services
        run: |
          kubectl apply -f kubernetes/datagen/
          kubectl apply -f kubernetes/dbt/
          kubectl apply -f kubernetes/dashboard/
      - name: Verify rollout
        run: kubectl rollout status deployment/nexusflow-serving -n nexusflow --timeout=5m
      - name: Smoke test
        run: |
          API_URL=$(kubectl get svc nexusflow-serving -n nexusflow -o jsonpath='{.status.loadBalancer.ingress[0].hostname}')
          curl -f "http://${API_URL}/health" || exit 1
