name: NexusFlow Deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: true
        default: dev
        type: choice
        options: [dev, prod]
      deploy_infra:
        description: Deploy Terraform infrastructure
        type: boolean
        default: false
      deploy_apps:
        description: Deploy Kubernetes apps
        type: boolean
        default: true
  push:
    branches: [main]
    paths-ignore: ["docs/**", "*.md"]

env:
  AWS_REGION: us-east-1
  PROJECT: nexusflow

jobs:
  # ── DETERMINE ENV ────────────────────────────────────────
  setup:
    name: Setup
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.env.outputs.environment }}
      deploy_infra: ${{ steps.env.outputs.deploy_infra }}
    steps:
      - id: env
        run: |
          ENV="${{ github.event.inputs.environment || 'dev' }}"
          INFRA="${{ github.event.inputs.deploy_infra || 'false' }}"
          echo "environment=$ENV"   >> $GITHUB_OUTPUT
          echo "deploy_infra=$INFRA" >> $GITHUB_OUTPUT

  # ── TERRAFORM DEPLOY ─────────────────────────────────────
  terraform-deploy:
    name: Terraform Apply (${{ needs.setup.outputs.environment }})
    runs-on: ubuntu-latest
    needs: setup
    if: needs.setup.outputs.deploy_infra == 'true'
    environment: ${{ needs.setup.outputs.environment }}
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.8.0

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ env.AWS_REGION }}

      - name: Terraform Init
        run: terraform init
        working-directory: terraform/environments/${{ needs.setup.outputs.environment }}

      - name: Terraform Plan
        run: terraform plan -var-file=terraform.tfvars -out=tfplan -detailed-exitcode
        working-directory: terraform/environments/${{ needs.setup.outputs.environment }}
        id: plan
        continue-on-error: true

      - name: Terraform Apply
        if: steps.plan.outputs.exitcode == 2
        run: terraform apply tfplan
        working-directory: terraform/environments/${{ needs.setup.outputs.environment }}

      - name: Save Terraform outputs
        run: |
          terraform output -json > /tmp/tf_outputs.json
          cat /tmp/tf_outputs.json
        working-directory: terraform/environments/${{ needs.setup.outputs.environment }}

  # ── PUSH IMAGES ──────────────────────────────────────────
  push-images:
    name: Push Images to ECR
    runs-on: ubuntu-latest
    needs: setup
    environment: ${{ needs.setup.outputs.environment }}
    strategy:
      matrix:
        service: [datagen, ingestion, processing, dbt, serving, dashboard]
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ env.AWS_REGION }}

      - name: Login to ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build & push image
        uses: docker/build-push-action@v5
        with:
          context: src/${{ matrix.service }}/
          push: true
          tags: |
            ${{ steps.ecr-login.outputs.registry }}/${{ env.PROJECT }}-${{ matrix.service }}:${{ github.sha }}
            ${{ steps.ecr-login.outputs.registry }}/${{ env.PROJECT }}-${{ matrix.service }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── KUBERNETES DEPLOY ────────────────────────────────────
  k8s-deploy:
    name: Deploy to EKS (${{ needs.setup.outputs.environment }})
    runs-on: ubuntu-latest
    needs: [setup, push-images]
    if: needs.setup.outputs.deploy_apps == 'true' || github.event.inputs.deploy_apps == 'true'
    environment: ${{ needs.setup.outputs.environment }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ env.AWS_REGION }}

      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig \
            --region ${{ env.AWS_REGION }} \
            --name ${{ env.PROJECT }}-${{ needs.setup.outputs.environment }}-cluster

      - name: Set image SHA in manifests
        run: |
          ECR_REGISTRY="${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com"
          sed -i "s|IMAGE_SHA|${{ github.sha }}|g" kubernetes/**/*.yml
          sed -i "s|ECR_REGISTRY|$ECR_REGISTRY|g"  kubernetes/**/*.yml

      - name: Deploy monitoring stack
        run: |
          helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
          helm repo add grafana https://grafana.github.io/helm-charts
          helm repo update
          helm upgrade --install kube-prometheus prometheus-community/kube-prometheus-stack \
            --namespace monitoring --create-namespace \
            --values kubernetes/monitoring/prometheus-values.yml \
            --wait --timeout 10m

      - name: Deploy Airflow
        run: |
          helm repo add apache-airflow https://airflow.apache.org
          helm repo update
          helm upgrade --install airflow apache-airflow/airflow \
            --namespace airflow --create-namespace \
            --values kubernetes/airflow/values.yml \
            --set images.airflow.tag=${{ github.sha }} \
            --wait --timeout 15m

      - name: Deploy application services
        run: |
          kubectl apply -f kubernetes/datagen/   --wait
          kubectl apply -f kubernetes/dbt/       --wait
          kubectl apply -f kubernetes/dashboard/ --wait

      - name: Verify rollout
        run: |
          kubectl rollout status deployment/nexusflow-api       -n nexusflow --timeout=5m
          kubectl rollout status deployment/nexusflow-datagen   -n nexusflow --timeout=5m
          kubectl rollout status deployment/nexusflow-dashboard -n nexusflow --timeout=5m

      - name: Run smoke tests
        run: |
          API_URL=$(kubectl get svc nexusflow-api -n nexusflow \
            -o jsonpath='{.status.loadBalancer.ingress[0].hostname}')
          curl -f "http://${API_URL}/health" || exit 1
          echo "✅ Smoke test passed"

      - name: Slack deploy notification
        uses: slackapi/slack-github-action@v1.26.0
        with:
          payload: |
            {
              "text": "🚀 NexusFlow deployed to *${{ needs.setup.outputs.environment }}* — SHA: `${{ github.sha }}`"
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
