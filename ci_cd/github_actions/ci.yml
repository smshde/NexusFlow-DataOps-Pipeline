name: NexusFlow CI

on:
  push:
    branches: [main, develop, "feature/**"]
  pull_request:
    branches: [main, develop]

env:
  PYTHON_VERSION: "3.11"
  AWS_REGION: us-east-1
  PROJECT: nexusflow

jobs:
  # ── CODE QUALITY ─────────────────────────────────────────
  lint-and-format:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install lint deps
        run: pip install black isort flake8 flake8-docstrings sqlfluff

      - name: Black
        run: black --check src/ airflow/dags/

      - name: isort
        run: isort --check src/ airflow/dags/

      - name: Flake8 (PEP8)
        run: flake8 src/ airflow/dags/ --max-line-length=100 --extend-ignore=E203,W503

      - name: SQLFluff (dbt models)
        run: sqlfluff lint dbt_project/models/ --dialect redshift --templater dbt

  # ── PYTHON TESTS ─────────────────────────────────────────
  python-tests:
    name: Python Unit Tests
    runs-on: ubuntu-latest
    needs: lint-and-format
    services:
      kafka:
        image: confluentinc/cp-kafka:7.6.0
        env:
          KAFKA_BROKER_ID: 1
          KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
          KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
          KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
        ports: ["9092:9092"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r src/datagen/requirements.txt
          pip install -r src/processing/requirements.txt
          pip install -r src/serving/requirements.txt
          pip install pytest pytest-cov pytest-asyncio moto[s3,glue] faker

      - name: Run unit tests
        run: |
          pytest src/ \
            -v \
            --cov=src \
            --cov-report=xml \
            --cov-report=term-missing \
            --junitxml=test-results.xml \
            -m "not integration"

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: coverage.xml

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: test-results.xml

  # ── TERRAFORM VALIDATE ───────────────────────────────────
  terraform-validate:
    name: Terraform Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.8.0

      - name: Terraform Format Check
        run: terraform fmt -check -recursive terraform/

      - name: Terraform Init (dev)
        run: terraform init -backend=false
        working-directory: terraform/environments/dev

      - name: Terraform Validate (dev)
        run: terraform validate
        working-directory: terraform/environments/dev

      - name: TFSec Security Scan
        uses: aquasecurity/tfsec-action@v1.0.3
        with:
          working_directory: terraform/
          soft_fail: true

  # ── DBT COMPILE ──────────────────────────────────────────
  dbt-compile:
    name: dbt Compile & Parse
    runs-on: ubuntu-latest
    needs: lint-and-format
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dbt
        run: pip install dbt-redshift dbt-utils

      - name: dbt deps
        run: dbt deps
        working-directory: dbt_project/

      - name: dbt parse (compile check)
        run: dbt parse --profiles-dir . --target ci
        working-directory: dbt_project/

      - name: dbt compile
        run: dbt compile --profiles-dir . --target ci
        working-directory: dbt_project/

  # ── DOCKER BUILD ─────────────────────────────────────────
  docker-build:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: [python-tests, terraform-validate, dbt-compile]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'
    strategy:
      matrix:
        service: [datagen, ingestion, processing, dbt, serving, dashboard]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ env.AWS_REGION }}

      - name: Login to ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: src/${{ matrix.service }}/
          push: true
          tags: |
            ${{ steps.ecr-login.outputs.registry }}/${{ env.PROJECT }}-${{ matrix.service }}:${{ github.sha }}
            ${{ steps.ecr-login.outputs.registry }}/${{ env.PROJECT }}-${{ matrix.service }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            BUILD_SHA=${{ github.sha }}
            BUILD_DATE=${{ github.event.head_commit.timestamp }}

  # ── SECURITY SCAN ─────────────────────────────────────────
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Trivy vulnerability scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif

  # ── INTEGRATION TESTS (dev only) ─────────────────────────
  integration-tests:
    name: Integration Tests (dev)
    runs-on: ubuntu-latest
    needs: docker-build
    if: github.ref == 'refs/heads/develop'
    environment: dev
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ env.AWS_REGION }}

      - name: Run E2E validation
        run: bash scripts/validate/e2e_test.sh dev
        env:
          NEXUSFLOW_ENV: dev

  # ── NOTIFY ───────────────────────────────────────────────
  notify:
    name: Notify
    runs-on: ubuntu-latest
    needs: [docker-build, security-scan]
    if: always()
    steps:
      - name: Slack notify success
        if: needs.docker-build.result == 'success'
        uses: slackapi/slack-github-action@v1.26.0
        with:
          payload: |
            {
              "text": "✅ NexusFlow CI passed on `${{ github.ref_name }}` — SHA: `${{ github.sha }}`"
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

      - name: Slack notify failure
        if: needs.docker-build.result == 'failure'
        uses: slackapi/slack-github-action@v1.26.0
        with:
          payload: |
            {
              "text": "🚨 NexusFlow CI FAILED on `${{ github.ref_name }}` — <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Run>"
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
